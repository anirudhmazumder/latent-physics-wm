# GitHub Pages configuration. The site is built from the repository root so
# every Markdown document renders as a page and the figures under runs/ are
# served at the same relative paths the documents already use.
title: latent-physics-wm
description: Learning world models that understand physics and cause and effect, one small environment at a time.
theme: jekyll-theme-cayman
show_downloads: false
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
plugins:
  - jekyll-relative-links      # links to foo.md become links to foo.html
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-default-layout
  - jekyll-titles-from-headings
relative_links:
  enabled: true
  collections: false
titles_from_headings:
  strip_title: true
# Each README.md becomes its directory's index.html (docs/ and wm/); the root
# README.md yields to index.md, which is the site front page.
readme_index:
  enabled: true
  remove_originals: true
exclude:
  # Source (.py/.sh) and small text files are published as raw files because the
  # documents link to them; only the large binaries and the data are left out.
  - data/
  - "**/*.pt"
  - "**/*.npy"
  - "**/__pycache__/"
  - environment.yml
  - requirements.txt
  - pytest.ini
  - Gemfile
  - Gemfile.lock
  - vendor/
include:
  - runs/
  # Jekyll skips files whose names begin with an underscore unless listed here.
  - runs/_eval_clock31.sh
  - runs/_eval_ctrl_v31.sh
  - runs/_eval_ctrl_v31_seeds.sh
  - runs/_eval_rnn_v31.sh
  - runs/_eval_v4.sh
  - runs/_stage1_v31.sh
  - runs/_stage1_v4.sh
  - runs/_train_ctrl_v3.sh
  - runs/_train_ctrl_v31.sh
  - runs/_train_ctrl_v31_real_s1.sh
  - runs/_train_ctrl_v31_s1.sh
  - runs/_train_rnn_clock31.sh
  - runs/_train_rnn_v31.sh
  - runs/_train_v4.sh
